name: 'Install Mods'
description: 'Download and install mods from lockfile using scripts/download.sh'
author: 'tra-mc'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        if ! command -v b3sum &>/dev/null; then
          echo "Installing b3sum..."
          if [[ "$OSTYPE" == "darwin"* ]]; then
            brew install b3sum
          else
            # For Ubuntu/Debian
            sudo apt-get update
            sudo apt-get install -y blake3
          fi
        fi

        if ! command -v jq &>/dev/null; then
          echo "Installing jq..."
          if [[ "$OSTYPE" == "darwin"* ]]; then
            brew install jq
          else
            sudo apt-get update
            sudo apt-get install -y jq
          fi
        fi

    - name: Download mods
      shell: bash
      run: bash scripts/download.sh
